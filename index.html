<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parcours Europe+ &mdash; Polemecatech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--stage:#12143a;--violet:#6666c9;--purple:#7043ab;--blue-l:#b2d1ff;--muted:#9aa0e0;--f-display:'Sora',sans-serif;--f-mono:'IBM Plex Mono',monospace}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--f-display);background:var(--stage);color:#fff;text-align:center;padding:2rem;position:relative;overflow-x:hidden}
.glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;pointer-events:none}
.g1{width:420px;height:420px;background:#7043ab;left:-120px;top:-140px}
.g2{width:520px;height:520px;background:#6666c9;right:-160px;bottom:-180px}
.kicker{display:inline-flex;align-items:center;gap:14px;font-family:var(--f-mono);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--blue-l);margin-bottom:22px}
.kicker::before{content:"";width:40px;height:3px;background:linear-gradient(90deg,var(--violet),var(--purple))}
h1{font-weight:800;font-size:clamp(36px,6vw,60px);letter-spacing:-.03em;margin:0 0 10px}
.grad{background:linear-gradient(120deg,#b2d1ff 0%,#6666c9 45%,#c8a6ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-family:var(--f-mono);font-size:13px;color:var(--muted);margin:0 0 40px;letter-spacing:.05em}
.links{display:flex;flex-direction:column;gap:.9rem;width:min(420px,92vw)}
a.b{display:block;padding:1rem 1.3rem;border-radius:12px;text-decoration:none;font-weight:700;font-size:1rem}
a.pub{background:linear-gradient(135deg,var(--violet),var(--purple));color:#fff}
a.mem{background:rgba(255,255,255,.06);border:1px solid rgba(214,214,255,.25);color:#d8dbff}
a.b:hover{filter:brightness(1.12)}
small{margin-top:2.2rem;color:var(--muted);font-family:var(--f-mono);font-size:.75rem;letter-spacing:.1em}
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>
<div class="kicker">Parcours Europe+ &middot; Mat&eacute;riaux / Batteries</div>
<h1>Poleme<span class="grad">catech</span></h1>
<p class="sub">Pr&eacute;sentation PE+ &middot; 2026-27</p>
<div class="links">
<a class="b pub" href="https://polemecatech.synnaptic.com/presentation/pe-plus-v1.html">Pr&eacute;sentation PE+ (publique) &rarr;</a>
<a class="b mem" href="https://polemecatech.synnaptic.com/">&#128274; Espace membres (r&eacute;serv&eacute;) &rarr;</a>
</div>
<small>SYNNAPTIC.COM / POLEMECATECH</small>
</body>
</html>
